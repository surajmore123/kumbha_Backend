# Add inside the `server` block for kumbhapath.in, in the KumbhaPath repo, ABOVE
# the location that proxies to Next.js. Exact matches (=) win over that location.
#
# It assumes the files from deploy/kumbhapath-web/ are mounted read-only into
# the nginx container at /srv/kumbhapath-web. See README.md.

# Android and Apple fetch these directly. No redirects, and the exact type.
location = /.well-known/assetlinks.json {
    alias /srv/kumbhapath-web/.well-known/assetlinks.json;
    default_type application/json;
    add_header Cache-Control "public, max-age=3600";
}

location = /.well-known/apple-app-site-association {
    alias /srv/kumbhapath-web/.well-known/apple-app-site-association;
    default_type application/json;
    add_header Cache-Control "public, max-age=3600";
}

# Shown only if the app isn't installed. The "#t=..." part never reaches nginx.
location ~ ^/join/family/?$ {
    alias /srv/kumbhapath-web/join-family.html;
    default_type text/html;
    add_header Cache-Control "no-store";
    add_header Referrer-Policy "no-referrer";
    add_header X-Robots-Tag "noindex";
}

# Shown when an ordinary camera opens a Safety QR. Holds no personal data.
location ~ ^/safety/qr/?$ {
    alias /srv/kumbhapath-web/safety-qr.html;
    default_type text/html;
    add_header Cache-Control "public, max-age=3600";
    add_header Referrer-Policy "no-referrer";
    add_header X-Robots-Tag "noindex";
}
